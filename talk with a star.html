/* ---------- profile: what is filled in, shortcuts, the badge spanning both rows ---------- */

.id-extra { display: grid; gap: 14px; min-width: 0; align-content: start; }

  function lightbox(list, i, e) {
    const img = h('img', { alt: '' });
    const cap = h('span');
    const count = h('span');
    const show = () => { const p = list[i]; img.src = url(p.file); cap.textContent = p.credit ? 'Фото: ' + p.credit : ''; count.textContent = `${i + 1} / ${list.length}`; };
    const step = (d) => { i = (i + d + list.length) % list.length; show(); };
    const close = () => { box.remove(); document.removeEventListener('keydown', key); };
    const key = (ev) => { if (ev.key === 'Escape') close(); else if (ev.key === 'ArrowRight') step(1); else if (ev.key === 'ArrowLeft') step(-1); };
    let x0 = null;
    const box = h('div', { class: 'lb', role: 'dialog', 'aria-modal': 'true', 'aria-label': 'Фото с мероприятия ' + e.title },
      h('header', null, h('span', { text: `${e.title} · ${shortDate(e.date)}` }), h('button', { type: 'button', 'aria-label': 'Закрыть', text: '×', onclick: close })),

    document.body.append(box);
    document.addEventListener('keydown', key);
    show();

  function openUpload(e, after) {
    sheet('Фото в отчёт', (box, close) => {
      const lim = (S.cfg && S.cfg.limits) || {};
      const input = h('input', { type: 'file', id: 'up-files', accept: 'image/jpeg,image/png,image/webp', multiple: true });
      const credit = h('input', { type: 'text', id: 'up-credit', value: S.me ? S.me.name : '', maxlength: 80 });

    const say = (t) => { const p = box.querySelector('p'); if (p) p.textContent = t; };
    try {
      for (let guard = 0; guard < 30; guard++) {
        const r = await api('covers_import', {});
        done.push(...r.done); failed.push(...r.failed);
        say(`Подтягиваем обложки с сайтов… готово ${done.length}${failed.length ? `, не вышло ${failed.length}` : ''}${r.left ? `, осталось ${r.left}` : ''}`);
        if (!r.left) break;
      }
      toast(`Обложки: ${done.length} загружено${failed.length ? `, ${failed.length} не получилось — их можно поставить вручную` : ''}`, 7000);
      if (failed.length) console.info('[events] обложки не загрузились:', failed);
    } catch (x) { if (!auto) toast(x.message, 7000); }
    importing = false;
    render(true);
  }

    document.querySelectorAll('.hero-facts dt, .kpi > b, .kpis > div > b, .wallet-card > b').forEach((el) => { if (CALM || el.dataset.cu) return; const r = el.getBoundingClientRect(); if (r.top < vh || !io) countUp(el); else { el._cu = [el]; io.observe(el); } });
    if (io) {
      document.querySelectorAll('.landing h2:not([data-fx]), .landing .sub:not([data-fx])').forEach((el) => { el.dataset.fx = 'w'; if (el.getBoundingClientRect().top < vh) return; words(el); el.classList.add('blurin'); io.observe(el); });
      document.querySelectorAll('.landing .bento, .landing .tiles, .landing .tariffs, .landing .stars, .landing .faq, .landing .ev-teasers, .landing .tagbox, .landing .swap').forEach((el) => { if (el.dataset.rv) return; el.dataset.rv = '1'; if (el.getBoundingClientRect().top < vh) return; el.classList.add('rise'); io.observe(el); });
    }
    document.querySelectorAll('[data-fx="swap"]:not([data-on])').forEach(swapStart);
    if (S.me) document.querySelectorAll('.id-head:not([data-lan])').forEach((el) => { el.dataset.lan = '1'; el.append(lanyard(S.me)); });
    document.querySelectorAll('[data-fx="focus"]:not([data-on])').forEach(focusStart);
    document.querySelectorAll('.plat-track:not([data-on])').forEach(velocityStart);
    if (FINE && !CALM) document.querySelectorAll('.landing .tile:not([data-px])').forEach(pixelStart);
  }
  // parts of pages arrive after the frame is drawn (carousels, lists): look again when the page grows
  let scanT = 0;
  new MutationObserver(() => { clearTimeout(scanT); scanT = setTimeout(fxScan, 120); }).observe(app, { childList: true, subtree: true });

  // card swap: the front card drops to the back of the stack
  function swapStart(box) {
    box.dataset.on = '1';
    const cards = [...box.children];
    let order = cards.map((_, i) => i);
    const place = () => order.forEach((ci, pos) => { const c = cards[ci]; c.style.setProperty('--p', String(pos)); c.style.zIndex = String(cards.length - pos); });
    place();
    if (CALM) return;
    const tick = () => { if (!box.isConnected) return; const first = cards[order[0]]; first.classList.add('drop'); setTimeout(() => { order.push(order.shift()); place(); first.classList.remove('drop'); }, 520); setTimeout(tick, 3200); };
    setTimeout(tick, 2600);
  }
  // true focus: one word sharp inside a frame, the rest soft
  function focusStart(box) {
    box.dataset.on = '1';
    const ws = [...box.children];
    const fr = h('i', { class: 'tf-frame', 'aria-hidden': 'true' });
    box.append(fr);
    let i = 0;
    const set = () => { if (!box.isConnected) return; ws.forEach((w, n) => w.classList.toggle('on', n === i)); const w = ws[i]; fr.style.width = w.offsetWidth + 'px'; fr.style.height = w.offsetHeight + 'px'; fr.style.transform = `translate(${w.offsetLeft}px, ${w.offsetTop}px)`; i = (i + 1) % ws.length; if (!CALM) setTimeout(set, 1500); };
    requestAnimationFrame(set);
  }
  // scroll velocity: the platform line runs on its own and faster while the page scrolls, in the direction of the scroll
  function velocityStart(track) {
    track.dataset.on = '1';
    if (CALM) return;
    track.style.animation = 'none';
    let x = 0, last = performance.now(), ly = scrollY, v = 0, dir = -1;
    const loop = (now) => {
      if (!track.isConnected) return;
      const dt = Math.min(64, now - last); last = now;
      const dy = scrollY - ly; ly = scrollY;
      v += (dy / dt * 16 - v) * 0.12;
      if (Math.abs(dy) > 0.5) dir = dy > 0 ? -1 : 1;
      const half = track.scrollWidth / 2 || 1;
      x += dir * (0.045 + Math.min(1.6, Math.abs(v) * 0.03)) * dt;
      if (x <= -half) x += half; if (x > 0) x -= half;
      track.style.transform = `translateX(${x.toFixed(1)}px)`;
      requestAnimationFrame(loop);
    };
    requestAnimationFrame(loop);
  }
  // pixel card: squares shimmer out from the centre while the pointer is over a tile
  function pixelStart(tile) {
    tile.dataset.px = '1';
    const cv = h('canvas', { class: 'px', 'aria-hidden': 'true' });
    tile.prepend(cv);
    let px = [], on = false, raf = 0, t0 = 0;
    const setup = () => { const r = tile.getBoundingClientRect(); cv.width = r.width; cv.height = r.height; px = []; const gap = 9, cx = r.width / 2, cy = r.height / 2; for (let x = 4; x < r.width; x += gap) for (let y = 4; y < r.height; y += gap) px.push({ x, y, d: Math.hypot(x - cx, y - cy), s: 0, ph: Math.random() * 6.28 }); };
    const cols = () => { const cs = getComputedStyle(document.documentElement); return [cs.getPropertyValue('--blob-a').trim(), cs.getPropertyValue('--blob-b').trim(), cs.getPropertyValue('--lilac').trim()]; };
    let palette = [];
    const draw = (now) => {
      const g = cv.getContext('2d'); g.clearRect(0, 0, cv.width, cv.height);
      const el = now - t0; let alive = false;
      px.forEach((p, i) => { const want = on && el > p.d * 2.2 ? 1 : 0; p.s += (want - p.s) * 0.12; if (p.s > 0.02) { alive = true; const size = p.s * (1.2 + 1.1 * Math.sin(now / 260 + p.ph)); g.globalAlpha = 0.5 * p.s; g.fillStyle = palette[i % 3]; g.fillRect(p.x, p.y, Math.max(0.4, size), Math.max(0.4, size)); } });
      if (alive || on) raf = requestAnimationFrame(draw); else raf = 0;
    };
    tile.addEventListener('pointerenter', () => { setup(); palette = cols(); on = true; t0 = performance.now(); if (!raf) raf = requestAnimationFrame(draw); });
    tile.addEventListener('pointerleave', () => { on = false; });
  }

  // lanyard: the member's badge hangs on a strap in the profile; it swings, and can be pulled and let go
  function lanyard(me, opts) {
    opts = opts || {};
    const role = opts.role || { admin: 'администратор', moder: 'модератор' }[me.role] || (me.vol === 'ok' ? 'волонтёр' : 'артист');
    const badge = h('div', { class: 'lan-card' }, h('span', { class: 'lan-clip' }),
      h('span', { class: 'lan-head' }, logoMark(), h('b', { text: 'talk with a star' })),
      avatar(me, 'big'), h('b', { class: 'lan-name', text: me.name }), h('span', { class: 'pill acc', text: role }),
      h('span', { class: 'lan-id mono', text: opts.idText || 'TWAS ID · ' + String(me.id).padStart(6, '0') }), h('span', { class: 'lan-bars', 'aria-hidden': 'true' }));
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('class', 'lan-strap'); svg.setAttribute('aria-hidden', 'true'); svg.append(path);
    const box = h('div', { class: 'lan', title: 'Бейдж можно потянуть' }, svg, badge);
    const L = 92;
    let W = 0, ax = 0, x = 0, y = L, px = 0, py = L, drag = false, raf = 0, still = 0;
    const put = () => { const ang = Math.atan2(x - ax, y); badge.style.transform = `translate(${(x - 90).toFixed(1)}px, ${y.toFixed(1)}px) rotate(${(-ang * 57.3 * 0.9).toFixed(2)}deg)`; const mx = (ax + x) / 2 + (x - ax) * 0.15, my = y * 0.5 + Math.max(0, L - Math.hypot(x - ax, y)) * 0.8; path.setAttribute('d', `M${ax} -6 Q${mx.toFixed(1)} ${my.toFixed(1)} ${x.toFixed(1)} ${(y + 4).toFixed(1)}`); };
    const size = () => { W = box.clientWidth || 300; const moved = ax === 0; ax = W / 2; if (moved) { x = ax + 46; px = x; y = L - 12; py = y; } };
    // the swing is stepped at a fixed 60 per second, whatever the screen's refresh rate
    let lastT = 0, acc = 0;
    const tick = (now) => {
      raf = 0;
      if (!box.isConnected) return;
      acc = Math.min(100, acc + (lastT ? now - lastT : 16.7)); lastT = now;
      for (; acc >= 16.6; acc -= 16.7) if (!drag) {
        const vx = (x - px) * 0.985, vy = (y - py) * 0.985;
        px = x; py = y; x += vx; y += vy + 0.9;
        const dx = x - ax, d = Math.hypot(dx, y);
        if (d > L) { x = ax + dx / d * L; y = y / d * L; }
        still = Math.abs(x - px) + Math.abs(y - py) < 0.03 ? still + 1 : 0;
      }
      put();
      if (still < 40 || drag) raf = requestAnimationFrame(tick);
    };
    const wake = () => { still = 0; if (!raf) { lastT = 0; raf = requestAnimationFrame(tick); } };
    badge.addEventListener('pointerdown', (e) => { if (CALM) return; drag = true; badge.setPointerCapture(e.pointerId); badge.classList.add('held'); wake(); e.preventDefault(); });
    badge.addEventListener('pointermove', (e) => { if (!drag) return; const r = box.getBoundingClientRect(); px = x; py = y; x = Math.max(20, Math.min(W - 20, e.clientX - r.left)); y = Math.max(20, Math.min(r.height - 150, e.clientY - r.top - 20)); });
    const drop = () => { if (!drag) return; drag = false; badge.classList.remove('held'); wake(); };
    badge.addEventListener('pointerup', drop); badge.addEventListener('pointercancel', drop);
    requestAnimationFrame(() => { size(); if (CALM) { x = ax; y = L; put(); } else wake(); });
    window.addEventListener('resize', () => { if (box.isConnected) { ax = 0; size(); wake(); } });
    return box;
  }

  /* ---------- start ---------- */
  let renderSeq = 0;
  async function render(keep) {
    const r = where();
    void keep;
    renderSeq++;
    if (!r.fn) { shell(h('div', { class: 'wrap page narrow center' }, h('p', { class: 'eyebrow', text: '404' }), h('h1', { text: 'Такой страницы нет' }), h('p', { class: 'muted', text: 'Возможно, ссылка устарела. Начните с главной или загляните в афишу.' }), h('div', { class: 'btnrow', style: { justifyContent: 'center' } }, link('/', { class: 'btn primary' }, 'На главную'), link('/events', { class: 'btn' }, 'Афиша')))); return; }
    try { await r.fn(); }
    catch (e) { console.error(e); errorPage(e); }
  }
  async function start() {
    try { S.cfg = await api('config'); S.me = S.cfg.me; if (S.cfg.today) S.today = S.cfg.today; if (!S.me && TOKEN) setToken(''); }
    catch (e) { app.replaceChildren(h('div', { class: 'boot' }, h('p', { text: e.message }), h('button', { class: 'btn', type: 'button', text: 'Повторить', onclick: () => location.reload() }))); return; }
    // another tab signed in or out: follow it
    window.addEventListener('storage', (e) => { if (e.key === 'twas.token') { TOKEN = store.json('twas.token', '') || ''; api('config').then((c) => { S.cfg = c; S.me = c.me; render(true); }).catch(() => null); } });
    // the installed app opens on the page chosen in the settings, once per launch
    try { const st = S.me && S.me.prefs && S.me.prefs.start; if (APP && st && where().path === '/cabinet' && !sessionStorage.getItem('twas.started')) { sessionStorage.setItem('twas.started', '1'); go(st === 'tools' ? '/tools' : '/cabinet/' + st, true); return; } } catch (e) { /* the overview then */ }
    render();
  }
  start();
  // the app shell is kept for offline starts; in the preview there is nothing to keep
  if (!DEMO && 'serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => navigator.serviceWorker.register(BASE + '/sw.js').catch(() => null));

})();
</script>
